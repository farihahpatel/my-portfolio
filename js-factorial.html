<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Factorial Calculator</title>
    <script>
        function factorial() {
            var n, fact;
            n = Number(document.getElementById("num").value);
            fact = 1;

            for (let i = 1; i <= n; i++) {
                fact = fact * i;
            }

            document.getElementById("result").innerHTML =
                "Factorial of " + n + " = " + fact;
        }
    </script>
</head>
<body>
    <p><a href="index.html#projects">← Back to portfolio</a></p>

    <h1>Factorial Calculator</h1>
    Enter Number: <input id="num">
    <button onclick="factorial()">Factorial</button>
    <p id="result"></p>
</body>
</html>
